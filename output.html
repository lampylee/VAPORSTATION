<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaporstation · projector</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas#out { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #cover { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5; image-rendering: pixelated;
    background-size: 8px 8px; transition: opacity 0.3s linear; }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none;
    padding: 18px 28px; background: rgba(27, 26, 36, 0.9); border: 1px solid #3c3a55; color: #dcdbe8;
    font: 600 28px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 1px; text-align: center; }
  #hint small { display: block; font-size: 15px; font-weight: 400; color: #8d8ba6; margin-top: 6px; }
  :fullscreen #hint, #hint[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="out"></canvas>
<div id="cover"></div>
<div id="hint">Click to go fullscreen<small>Vaporstation projector output</small></div>
<script type="module" src="js/show/output-page.js"></script>
</body>
</html>
