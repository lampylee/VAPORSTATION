<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS1 Pipeline Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: fixed; left: 8px; top: 8px; color: #9f9; font: 12px monospace; background: #000a; padding: 6px 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">PS1 pipeline test. Keys: J jitter 0/1/3 · A affine on/off · R resolution · D dither on/off · C CRT</div>
<script type="module">
  import { PS1Renderer, RESOLUTIONS } from './js/gfx/ps1.js';
  import { Sink } from './js/show/output.js';
  import { TestScene } from './js/styles/test-scene.js';
  const r = new PS1Renderer();
  const sink = new Sink(document.getElementById('c'));
  const fit = () => { const z = sink.size; r.setOutputSize(z.w, z.h, z.dpr); r.resize(); };
  fit();
  import { LivePalette } from './js/palette/palette.js';
  const scene = new TestScene();
  scene.pal = new LivePalette(r, TestScene.palette);
  scene.init(r);
  const audio = { level: 0, bass: 0, mid: 0, high: 0, beat: false, beatPulse: 0 };
  const jitters = [1, 3, 0], resList = Object.keys(RESOLUTIONS);
  let ji = 0, ri = 0;
  addEventListener('resize', fit);
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase(), P = r.params;
    if (k === 'j') P.jitter = jitters[ji = (ji + 1) % 3];
    if (k === 'a') P.affine = P.affine ? 0 : 1;
    if (k === 'd') P.dither = P.dither ? 0 : 1;
    if (k === 'c') P.crt = !P.crt;
    if (k === 'r') { P.resolution = resList[ri = (ri + 1) % resList.length]; r.resize(); }
    document.getElementById('info').textContent =
      `jitter ${P.jitter} · affine ${P.affine} · dither ${P.dither} · crt ${P.crt} · ${r.width}x${r.height}`;
  });
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    scene.update(audio, 0, dt);
    r.beginScene('A'); r.setPalette(scene.pal); scene.render(r); r.composite(0); r.present();
    sink.show(r.takeFrame());
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
